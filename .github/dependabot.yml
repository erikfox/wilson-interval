# Keeps the GitHub Actions used in .github/workflows up to date.
# The package has no npm dependencies, so there is no npm ecosystem entry.
# Options: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it, so a compromised or
    # broken release has time to be caught and yanked first
    cooldown:
      default-days: 7
