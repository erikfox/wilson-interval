# Adapted from https://github.com/codecov/example-javascript
name: Codecov Test Coverage Report
on: [pull_request]
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm run test:cc
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: erikfox/wilson-interval