# Runs on every push to master and every pull request against it.
# Each check is its own job so it shows up as its own named status check,
# and can be marked as required in branch protection.
# Node.js docs: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress. Each push to
# master gets its own group (keyed by SHA), so master runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, latest]
        # Supported releases: https://nodejs.org/en/about/previous-releases ("latest" is the newest Current release)
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm test

  types:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'npm'
    - name: Type-check src/index.d.ts
      run: npm run test:types

  reference:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Check reference values match scripts/reference.py
      run: python3 -I scripts/reference.py --check scripts/reference.json

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    # Biome runs through a pinned npx in package.json, so there is nothing to install
    - name: Lint and check formatting with Biome
      run: npm run lint

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: 'npm'
    - run: npm ci
    # Fails the job if line, branch or function coverage drops below 100%
    - run: npm run test:cc
    # Codecov is for the PR comment and badge only. An outage, or a fork PR
    # without the token, shouldn't fail CI: the step above already enforces 100%.
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: erikfox/wilson-interval
        files: lcov.info
        fail_ci_if_error: false

  # Checks what `npm publish` would ship, before a release does it for real.
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    # Fails if a file is added to or missing from the tarball
    - name: Check the published files
      run: |
        npm pack --dry-run --json | node -e '
          const expected = ["LICENSE", "README.md", "package.json", "src/index.d.ts", "src/index.js"];
          const [{ files }] = JSON.parse(require("fs").readFileSync(0, "utf8"));
          const actual = files.map((f) => f.path).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            console.error("::error::npm pack would publish: " + actual.join(", ") + ". Expected: " + expected.join(", "));
            process.exit(1);
          }
          console.log("npm pack publishes: " + actual.join(", "));
        '
    # package.json fields and exports point at files that exist; --strict fails on warnings too
    - name: Lint the package with publint
      run: npx -y publint@0.3.25 --strict
    # The types resolve for ESM consumers (node16, bundler). The package is ESM-only,
    # so the CommonJS require() resolution is skipped rather than reported.
    - name: Check the types with arethetypeswrong
      run: npx -y @arethetypeswrong/cli@0.18.5 --pack . --profile esm-only
