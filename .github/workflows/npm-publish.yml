# Runs the tests, then publishes the package to npm when a GitHub release is created.
# Authenticates with npm trusted publishing (OIDC), so no npm token secret is needed,
# and npm adds a provenance attestation automatically.
# See https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No cache in the release workflow, so a poisoned cache entry can't reach a publish
          package-manager-cache: false
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run test:types

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm exchange a GitHub OIDC token for publish rights
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later. Node 24 bundles a new enough
      # npm (24.5.0+), so check it instead of installing an unpinned npm@latest.
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) {
              console.error("::error::npm " + process.argv[1] + " is too old for trusted publishing (needs 11.5.1+)");
              process.exit(1);
            }
            console.log("npm " + process.argv[1]);
          ' "$(npm --version)"
      - run: npm ci
      # Prerelease versions (e.g. 6.0.0-rc.0) go to the "next" dist-tag so they
      # don't become "latest"; npm refuses to publish them without a tag anyway
      - name: Publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          case "$VERSION" in
            *-*) npm publish --tag next ;;
            *) npm publish ;;
          esac
