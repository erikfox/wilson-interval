name: Bug report
description: Wrong results, an unexpected error, or other broken behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please check the [open issues](https://github.com/erikfox/wilson-interval/issues) first in case it's already known.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls wilson-interval`
      placeholder: "5.1.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`
      placeholder: "v24.0.0"
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Code to reproduce
      description: The exact call, with its arguments.
      render: js
      placeholder: |
        import wilson from 'wilson-interval';
        console.log(wilson(5, 100));
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The output or error you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong result, give the expected values and where they come from (a paper, another library, a hand calculation).
    validations:
      required: true
